name: reviewbench-image

# Builds the ALMA ReviewBench agent image for linux/amd64 and publishes it
# to GHCR, printing the sha256 digest that the ReviewBench portal requires.
#
# MANUAL ONLY: this workflow runs exclusively on workflow_dispatch.  No
# push, no schedule, no automatic publication.  Pressing "Run workflow" in
# the GitHub UI is the human gate for decision A (publish the image).
#
# Where this file goes: .github/workflows/reviewbench-image.yml of the
# repo that contains this package (see workflows/README.md in the package).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (the registration uses the digest, not the tag)"
        required: true
        default: "dev"
      package_dir:
        description: "Path of this reviewbench package inside the repo ('.' if it is the repo root)"
        required: true
        default: "."

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.package_dir }}
          file: ${{ inputs.package_dir }}/Dockerfile
          platforms: linux/amd64
          push: true
          # No provenance/SBOM attestations: the ReviewBench manifest pins
          # ONE image digest, and attestations would wrap it in an index.
          provenance: false
          sbom: false
          tags: ghcr.io/almaoficial/alma-reviewbench:${{ inputs.tag }}

      - name: Emit the digest for the ReviewBench registration
        run: |
          DIGEST="ghcr.io/almaoficial/alma-reviewbench@${{ steps.build.outputs.digest }}"
          echo "Image digest: $DIGEST"
          {
            echo "## ReviewBench image published"
            echo ""
            echo "Paste this digest into the portal registration form (REGISTRO-REVIEWBENCH.md):"
            echo ""
            echo "\`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
